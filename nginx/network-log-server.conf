# Network Log Server -- nginx site.
#
# nginx terminates client connections, serves the three static frontend files
# directly and proxies /api to uvicorn on loopback. The API never listens on a
# public interface.
#
# To enable HTTPS: obtain a certificate (certbot --nginx works), then set
# `cookie_secure: true` in /etc/network-log-server/log-server.yaml and restart
# the API so session cookies stop being sent over plaintext.

# Login attempts are rate limited at the edge as well as in the application,
# so a flood never reaches Argon2 verification in the first place.
limit_req_zone $binary_remote_addr zone=nls_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=nls_api:10m rate=30r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/network-log-server.access.log;
    error_log  /var/log/nginx/network-log-server.error.log;

    root /opt/network-log-server/frontend;
    index index.html;

    # Logo uploads are capped at 2 MB by the API; reject bigger bodies here
    # so they never reach Python.
    client_max_body_size 4m;
    client_body_timeout 30s;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json;
    gzip_min_length 1024;

    location = /api/auth/login {
        limit_req zone=nls_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8088;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=nls_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8088;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        # A "Count all" over a wide range can legitimately take a while.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location /assets/ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Single-page app: everything else falls back to the shell.
    location / {
        try_files $uri /index.html;
    }

    location ~ /\. { deny all; }
}
